<!DOCTYPE html>
<html lang="ja">
<head>
<script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ルミナモンスターズ（テスト版）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E4ECDB;--panel:#FAFCF6;--panel2:#EEF3E7;--ink:#2A2440;--muted:#69637E;--line:#C9D4BD;
  --moss:#3E6B48;--moss-ink:#FFFFFF;--gold:#B87C0E;--good:#2E7D4F;--bad:#B83A2E;--normal:#6E6886;
  --og:#4FA45E;--oy:#D9A92B;--or:#D2533F;--shade:rgba(30,26,46,.45);
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#16151E;--panel:#222031;--panel2:#2A283C;--ink:#EEEAF8;--muted:#A8A2BF;--line:#3A3753;
    --moss:#6FA27A;--moss-ink:#0F140E;--gold:#E8B54A;--good:#62C489;--bad:#EC7E72;--normal:#A8A2BF;
    --shade:rgba(0,0,0,.6);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16151E;--panel:#222031;--panel2:#2A283C;--ink:#EEEAF8;--muted:#A8A2BF;--line:#3A3753;
  --moss:#6FA27A;--moss-ink:#0F140E;--gold:#E8B54A;--good:#62C489;--bad:#EC7E72;--normal:#A8A2BF;
  --shade:rgba(0,0,0,.6);color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'M PLUS Rounded 1c',"Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;font-size:15px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.pix{font-family:'DotGothic16',"Hiragino Sans",monospace}
#app{height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto}

/* base header */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;background:var(--panel);border-bottom:2px solid var(--line)}
.logo{font-size:17px;letter-spacing:.01em;white-space:nowrap}
.sub{display:block;font-size:12px;color:var(--muted)}
.orbs{display:flex;gap:4px;align-items:center;flex:none}
.orb{display:inline-flex;align-items:center;gap:4px;font-weight:800;font-size:14px;background:var(--panel2);border-radius:999px;padding:3px 7px 3px 4px}
.orb i{width:16px;height:16px;border-radius:50%;display:inline-block;box-shadow:inset -3px -3px 0 rgba(0,0,0,.18),inset 2px 2px 0 rgba(255,255,255,.5)}
.o-g{background:var(--og)}.o-y{background:var(--oy)}.o-r{background:var(--or)}

.main{flex:1;min-height:0;overflow-y:auto;padding:14px 14px 20px}
.nav{display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr 1.15fr;gap:3px;padding:8px 10px;background:var(--panel);border-top:2px solid var(--line)}
.nav button{border:0;background:transparent;border-radius:12px;padding:10px 0;font-size:13px;font-weight:700;color:var(--muted)}
.nav button[aria-current="true"]{background:var(--panel2);color:var(--ink)}
.nav .go{background:var(--moss);color:var(--moss-ink);font-weight:800;font-size:17px}

h2{font-size:17px;margin:0 0 4px}
.lead{color:var(--muted);font-size:13px;margin:0 0 12px}
.rowh{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.small{font-size:12px;color:var(--muted)}
.linkbtn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:3px 10px;font-size:12px;color:var(--muted)}

/* cards */
.list{display:grid;gap:8px}
.card{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:2px solid var(--line);background:var(--panel);border-radius:14px;padding:8px 10px;position:relative}
.card:disabled{opacity:.45}
.card.sel{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}
.card.special{border-color:#C9A8F0}
.card.special.sel{border-color:var(--gold)}
.cinfo{display:flex;flex-direction:column;min-width:0;flex:1}
.cname{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmeta{font-size:12px;color:var(--muted)}
.ctags{display:flex;gap:4px;margin-top:2px}
.ctags i{font-style:normal;font-size:11px;border:1px solid var(--line);border-radius:6px;padding:0 5px;font-weight:700}
.note{font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap}
.lim{font-size:11px;font-weight:800;color:#fff;background:linear-gradient(90deg,#8D6BE0,#E07BB5);border-radius:6px;padding:0 6px;margin-left:6px;vertical-align:2px}
.av{position:relative;flex:none;display:inline-block;border-radius:50%;background:var(--c);box-shadow:inset 0 -4px 0 rgba(0,0,0,.08)}
.av img{display:block;width:118%;height:118%;margin:-9%;pointer-events:none}
.rk{position:absolute;right:-4px;bottom:-4px;font-family:'DotGothic16',monospace;font-size:12px;line-height:1;color:#fff;border-radius:6px;padding:2px 4px;font-weight:400;border:1.5px solid var(--panel)}
.rk-F{background:#8C8C8C}.rk-E{background:#4E9A55}.rk-D{background:#2E8C8C}.rk-C{background:#3C6EC7}.rk-B{background:#8250C4}.rk-A{background:#D46A1F}.rk-S{background:#C9A013}

/* buttons */
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:800;background:var(--moss);color:var(--moss-ink)}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--ink)}
.btn.warn{background:var(--bad);color:#fff}
.btn.full{width:100%}
.row{display:flex;gap:8px;margin-top:14px}
.row .btn{flex:1}

/* sheet */
.ov{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--shade);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--panel);width:100%;max-width:520px;max-height:86%;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet.center{border-radius:20px;margin:auto 16px;align-self:center;text-align:center}
.dhead{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.dname{font-size:19px;font-weight:800}
.lvrow{display:flex;align-items:center;gap:10px;margin:8px 0 12px}
.bar{flex:1;height:8px;border-radius:99px;background:var(--panel2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold)}
.bar.hp i{background:var(--good)}
table.stats{width:100%;border-collapse:collapse;font-size:14px}
table.stats th{text-align:left;color:var(--muted);font-weight:700;padding:5px 0;width:22%}
table.stats td{font-weight:800;padding:5px 0;width:28%}
.skill{background:var(--panel2);border-radius:12px;padding:10px 12px;margin-top:10px}
.skill p{margin:2px 0 0;font-size:13px;color:var(--muted)}

/* fusion */
.fslots{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.fslot{min-height:120px;border:2px dashed var(--line);border-radius:16px;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px 6px;font-weight:700;color:var(--muted)}
.fslot.on{border-style:solid;color:var(--ink)}
.plus{font-size:24px;font-weight:800;color:var(--muted)}
.fres{margin-top:14px;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:14px}
.compat{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.cbadge{font-weight:800;border-radius:10px;padding:3px 12px;color:#fff}
.c-good{background:var(--good)}.c-normal{background:var(--normal)}.c-bad{background:var(--bad)}
.calc{font-size:13px;color:var(--muted);margin:0 0 10px}
.outcome{font-weight:800;margin:8px 0 0}

/* gacha */
.gacha{display:flex;align-items:center;gap:12px;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}
.gacha .ob{width:46px;height:46px;border-radius:50%;flex:none;box-shadow:inset -6px -7px 0 rgba(0,0,0,.18),inset 5px 5px 0 rgba(255,255,255,.45)}
.gacha .gi{flex:1;display:flex;flex-direction:column}
.gacha .gi b{font-size:16px}
.notice{background:var(--panel2);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.reveal{font-size:15px;margin:10px 0 2px;color:var(--muted)}
.reveal-name{font-size:22px;font-weight:800;margin:0 0 6px}
.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.pop{animation:none}}

/* sound / dex */
.sndbtn{border:0;background:var(--panel2);border-radius:999px;width:30px;height:28px;font-weight:800;font-size:15px;color:var(--ink)}
.dex{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.dcell{position:relative;display:flex;flex-direction:column;align-items:center;border:2px solid var(--line);background:var(--panel);border-radius:12px;padding:4px 2px 6px}
.dcell img{width:100%;max-width:84px;aspect-ratio:1;display:block}
.dcell.unk img{opacity:.55}
.dcell.own{border-color:var(--gold)}
.dno{font-size:10px;color:var(--muted);font-family:'DotGothic16',monospace}
.dnm{font-size:11px;font-weight:800;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dstar{position:absolute;top:2px;right:5px;font-style:normal;color:var(--gold);font-size:13px}
.dexhero{border-radius:16px;display:flex;justify-content:center;padding:6px}
.dexhero img{width:180px;height:180px}
.newdex{font-weight:800;color:var(--gold);margin:6px 0 0}
/* dot / 3d / party */
.av img,.dcell img,.m3 img{image-rendering:pixelated;image-rendering:-webkit-optimize-contrast;image-rendering:crisp-edges}
.rrow{display:flex;gap:6px;align-items:stretch}.rrow .card{flex:1;min-width:0}
.detbtn{flex:none;width:58px;border:2px solid var(--line);background:var(--panel2);border-radius:14px;font-weight:800;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.detbtn small{font-size:10px;color:#fff;background:#8D6BE0;border-radius:5px;padding:0 5px;font-family:'DotGothic16',monospace}
.m3{position:relative;height:250px;border-radius:16px;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:10px}
.m3 canvas{display:block;width:100%;height:100%}
.m3load{font-size:13px;color:#69637E}
.m3hint{position:absolute;right:10px;bottom:8px;font-size:11px;color:#5A5470;background:rgba(255,255,255,.7);border-radius:6px;padding:1px 6px;pointer-events:none}
/* home */
.ranch{position:relative;height:min(52vh,430px);border-radius:20px;overflow:hidden;background:linear-gradient(180deg,#8FD0F5 0%,#CFEFFF 55%,#E9F7FF 100%);box-shadow:inset 0 0 0 2px var(--line)}
.ranch canvas{display:block;width:100%;height:100%}
.rlabel{position:absolute;left:12px;top:10px;font-size:16px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35);pointer-events:none}
.rtip{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:rgba(43,37,64,.9);color:#fff;border-radius:999px;padding:6px 8px 6px 14px;display:flex;gap:8px;align-items:center;font-size:13px;white-space:nowrap}
.rtip .linkbtn{background:#fff;color:#2B2540;border:0}
.rfallback{position:absolute;inset:auto 0 30px 0;display:flex;justify-content:center;gap:6px}.rfallback img{width:56px;height:56px;image-rendering:pixelated}
.homeinfo{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.hstat{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:8px 4px;text-align:center;display:flex;flex-direction:column}
.hstat b{font-size:20px;font-weight:400}.hstat span{font-size:11px;color:var(--muted)}
.bigo{font-size:19px;padding:14px}
/* settings / party */
.setrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.setrow span{flex:none;width:7.5em;font-weight:700}.setrow input{flex:1;accent-color:var(--moss)}.setrow b{width:2.2em;text-align:right;font-family:'DotGothic16',monospace;font-weight:400}
.tgl{margin-left:auto;border:2px solid var(--line);background:var(--panel2);border-radius:999px;padding:6px 14px;font-weight:800;color:var(--muted)}.tgl.on{background:var(--moss);color:var(--moss-ink);border-color:var(--moss)}
.slotbar{display:flex;gap:4px;margin:0 0 10px}.slotbar i{flex:1;height:8px;border-radius:4px;background:var(--panel2);border:1px solid var(--line)}.slotbar i.on{background:var(--gold);border-color:var(--gold)}
/* legend */
.c-legend{background:linear-gradient(90deg,#B8860B,#E0244A)}
.recipe{display:flex;align-items:center;gap:10px;border:2px solid var(--gold);background:var(--panel);border-radius:14px;padding:8px 10px}
.recipe.lock{border-color:var(--line);opacity:.7}.rq{width:48px;height:48px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;font-size:24px;flex:none}
.ov.legend{background:radial-gradient(circle at 50% 40%,#4A3478 0%,#120C1E 75%);align-items:center}
.lgbox{position:relative;text-align:center;padding:18px 18px 26px;color:#fff;width:100%;max-width:440px;overflow:hidden}
.rays{position:absolute;left:50%;top:38%;width:1000px;height:1000px;margin:-500px 0 0 -500px;background:repeating-conic-gradient(rgba(255,226,122,.16) 0 9deg,rgba(255,226,122,0) 9deg 18deg);animation:spin 14s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.lgsub{position:relative;font-size:20px;letter-spacing:.3em;color:#FFE27A;margin:0;animation:glow 1.2s ease-in-out infinite alternate}
@keyframes glow{from{text-shadow:0 0 4px #FFB13B}to{text-shadow:0 0 18px #FFE27A}}
.m3.lgm{position:relative;background:transparent;box-shadow:none;height:280px;animation:pop .8s cubic-bezier(.2,1.6,.4,1)}
.lgname{position:relative;font-size:34px;margin:4px 0;color:#FFF3B0;text-shadow:0 3px 0 #8A5F0C}
.lgtext{position:relative;font-weight:800;margin:0 0 4px}.lgmeta{position:relative;font-size:13px;color:#D8CCF2;margin:0 0 14px}
.lgbox .btn{position:relative;min-width:180px;background:linear-gradient(180deg,#F6C744,#C98A12);color:#2B1D04}
@media (prefers-reduced-motion:reduce){.rays,.lgsub,.m3.lgm{animation:none}}
/* player skills */
.psrow{margin-bottom:5px}
.mana{display:flex;align-items:center;gap:6px;margin-bottom:4px}.mana span.pix{font-size:11px;color:#6B9BFF}.mana b{font-weight:400;font-size:13px;width:2.2em;text-align:right;color:#3A6FE0}
.mbar{flex:1;height:7px;border-radius:99px;background:var(--panel2);overflow:hidden;display:block}.mbar i{display:block;height:100%;background:linear-gradient(90deg,#5AA6FF,#9B7BFF)}
.psb{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.psk{display:grid;grid-template-columns:20px 1fr;grid-template-rows:auto auto;column-gap:4px;align-items:center;text-align:left;border:2px solid var(--line);background:var(--panel2);border-radius:10px;padding:3px 4px;min-width:0;opacity:.55;touch-action:manipulation}
.psk.ok{opacity:1;border-color:var(--pc);box-shadow:0 0 0 1px var(--pc) inset}
.psk i{grid-row:1/3;width:20px;height:20px;border-radius:50%;background:var(--pc);color:#fff;font-style:normal;font-weight:800;font-size:11px;display:grid;place-items:center}
.psk span{font-size:10px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;text-align:left}
.psk small{font-size:9px;color:var(--muted);white-space:nowrap}
/* story / shop */
.o-gold{background:linear-gradient(135deg,#FFE27A,#C98A12)}
.talk{position:fixed;top:0;left:0;right:0;bottom:0;z-index:90;display:flex;align-items:center;justify-content:center;background:rgba(10,8,20,.62)}
.tbox{position:relative;margin:0 16px;width:calc(100% - 32px);max-width:460px;min-height:220px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:22px 18px 34px;animation:pop .35s cubic-bezier(.2,1.5,.4,1);background:#1E1A30;border:3px solid #E8DFFF;border-radius:14px;color:#fff}
.tface{width:104px;height:104px;flex:none;border-radius:10px;background:#2E2748;image-rendering:pixelated}
.ttext b{color:#FFE27A;font-size:17px}.ttext p{margin:6px 0 0;font-size:19px;line-height:1.7;font-weight:700}
.tnext{position:absolute;left:0;right:0;bottom:8px;font-size:12px;color:#E8DFFF;animation:glow 1s ease-in-out infinite alternate}
.tskip{position:absolute;right:0;top:-42px;border:0;border-radius:999px;padding:5px 14px;background:rgba(30,26,48,.85);color:#fff;font-weight:800;font-size:12px}
.msub{display:block;font-size:11px;font-weight:700;opacity:.8}
.chap{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:2px solid var(--line);background:var(--panel);border-radius:14px;padding:10px}.chap.lock{opacity:.5}
.corb,.shard{width:26px;height:26px;border-radius:50%;border:3px solid var(--oc,#888);flex:none;box-shadow:inset -3px -3px 0 rgba(0,0,0,.2)}
.shards{display:flex;align-items:center;gap:6px;margin:0 0 10px;flex-wrap:wrap}.shard{width:22px;height:22px;background:transparent}.shard.on{background:var(--oc)}
.hbtns{display:grid;grid-template-columns:1.3fr 1fr;gap:8px}
.orbget{display:flex;align-items:center;gap:10px;justify-content:center;margin:10px 0}.bigorb{width:44px;height:44px;border-radius:50%;box-shadow:inset -6px -7px 0 rgba(0,0,0,.25),inset 5px 5px 0 rgba(255,255,255,.4),0 0 18px rgba(255,226,122,.6)}
.clear{text-align:center}
.shopst{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px}.shopst.lock{opacity:.55;display:flex;justify-content:space-between;align-items:center}
.shopit{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line)}.sic{width:34px;height:34px;border-radius:10px;background:var(--panel2);display:grid;place-items:center;font-size:18px;flex:none}
.shopit .btn{padding:8px 12px;min-width:84px}
.inh{margin-top:12px}.inhb{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:4px}
.inhb button{border:2px solid var(--line);background:var(--panel2);border-radius:12px;padding:8px 4px;font-weight:800;font-size:13px}.inhb button.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}.inhb small{display:block;font-weight:400;font-size:10px;color:var(--muted)}
.sktag.inh{background:#C98A12}
/* long press */
[data-lp]{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
img{-webkit-touch-callout:none}
.inhb em{display:block;font-style:normal;font-weight:400;font-size:11px;color:var(--muted);margin-top:4px;line-height:1.4;text-align:left}
/* title / tutorial */
.title{position:relative;height:100%;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:radial-gradient(ellipse at 50% 30%,#3E3270 0%,#1A1530 60%,#0E0B1A 100%);color:#fff;text-align:center;padding:20px}
.tstars{position:absolute;inset:0;pointer-events:none}.tstars i{position:absolute;width:3px;height:3px;background:#FFF3B0;border-radius:1px;animation:tw 2.4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
.tlogo{position:relative;z-index:1}
.lgb{white-space:nowrap;padding:7px 12px;border-radius:999px;border:1px solid var(--line,#ccc);background:transparent;color:inherit;font:inherit;font-size:13px;cursor:pointer}.lgb.on{background:var(--gold,#C98A12);color:#fff;border-color:transparent}
.tlang{position:absolute;top:12px;right:12px;z-index:5;border:1px solid rgba(255,255,255,.5);background:rgba(20,16,40,.55);color:#fff;border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}.tsub{display:block;letter-spacing:.5em;color:#C9A8F0;font-size:14px;margin-left:.5em}
.tlogo h1{margin:4px 0 0;font-weight:400;font-size:46px;line-height:1.05;color:#FFE27A;text-shadow:0 4px 0 #B8650B,0 8px 0 #5A2A0A,0 0 24px rgba(255,200,80,.5)}

const rankOf=ikai=>Math.ceil(ikai/10)-1;
const rankL=sp=>RANKS[rankOf(sp.ikai)];
const ones=ikai=>{const o=ikai%10;return o===0?10:o;};
const needExp=lv=>Math.floor(12*Math.pow(lv,1.7));
function allyStats(sp,lv,mm){
  const m=sp.size==='S'?0.85:sp.size==='M'?1:1.25;
  const P0=sp.pw||sp.ikai,L=mm?pasList(mm):[PS(sp.id)],pr=t=>L.filter(x=>x.t===t).reduce((a,x)=>a*x.a,1);
  const pl=1+.05*Math.min(10,(mm&&mm.plus)||0),eA=(1+((S&&S.eq)?eqTotal('atk'):0)/100)*pl,eH=(1+((S&&S.eq)?eqTotal('hp'):0)/100)*pl;
  return {hp:Math.max(1,Math.floor((12+P0*3)*m*(1+0.07*(lv-1))*eH)),atk:Math.max(1,Math.floor((2+P0*0.5)*m*(1+0.06*(lv-1))*eA)),range:Math.round(FAM_RANGE[sp.fam]*pr('range')),interval:+(FAM_INT[sp.fam]*pr('rapid')).toFixed(2),revive:Math.max(2,Math.round(sp.revive*pr('quick')))};
}
function compat(a,b){
  const k=Math.min(a.id,b.id)+'-'+Math.max(a.id,b.id);
  if(EXC[k])return{v:EXC[k],src:'個別の相性'};
  return{v:FAMC[a.fam][b.fam],src:'所属：'+FAM[a.fam]+'×'+FAM[b.fam]};
}
function fusePreview(a,b){
  const rk=BOSSKEYS.find(k=>{const q=BOSSDEF[k].pair;return(a.id===q[0]&&b.id===q[1])||(a.id===q[1]&&b.id===q[0]);});
  if(rk&&S.recipes[rk]){const B=BOSSDEF[rk];return{c:{v:'r',src:'特別な合体レシピ'},rank:rankOf(B.ikai),ikai:B.ikai,childId:B.id,legend:rk,random:false,calc:`レシピ：${a.name}＋${b.name}`,out:'伝説のモンスターが生まれる！'};}
  const rA=rankOf(a.ikai),rB=rankOf(b.ikai);
  let base,val,calc;
  if(rA===rB){base=rA;val=ones(a.ikai)+ones(b.ikai);calc=`同ランク：1の位 ${ones(a.ikai)}＋${ones(b.ikai)}＝${val}`;}
  else{const hi=rA>rB?a:b;base=Math.max(rA,rB);val=ones(hi.ikai)+1;calc=`ランク違い：高い方の1の位 ${ones(hi.ikai)}＋1＝${val}`;}
  const c=compat(a,b);
  let rank=base,o=Math.min(val,10),random=false,out='同じランク';
  if(c.v==='g'&&val>10){if(base<6){rank=base+1;o=val-10;out='ランクアップ！';}else{o=10;out='Sランクの上限';}}
  else if(c.v==='b'){if(base===0){random=true;out='Fランクからランダム';}else{rank=base-1;out='ランクダウン';}}
  else if(val>10){out='10で止まる';}
  return{c,rank,ikai:rank*10+o,random,calc,out};
}

      el.addEventListener('pointermove',e=>{if(!R3.drag)return;R3.ry=R3.drag.ry+(e.clientX-R3.drag.x)*.012;R3.rx=Math.max(-.5,Math.min(.6,R3.drag.rx+(e.clientY-R3.drag.y)*.008));});
      ['pointerup','pointercancel','pointerleave'].forEach(ev=>el.addEventListener(ev,()=>{R3.drag=null;}));}
    if(R3.obj){R3.sc.remove(R3.obj);disposeObj(R3.obj);}

  }).catch(()=>{box.innerHTML=`<img src="${spriteURL(id)}" alt="" style="width:160px;height:160px"><span class="m3hint">3Dモデルを読み込めませんでした</span>`;});

    // 地面と柵

    add(new T.CylinderGeometry(15.6,16.4,2.4,56),0x8A6A44,[0,-2.3,0],null,null,false);
    for(let i=0;i<40;i++){const a=i/40*PI*2;add(new T.CylinderGeometry(.16,.18,1.5,8),0xA97E4F,[Math.cos(a)*14.3,.75,Math.sin(a)*14.3]);}
    [.55,1.15].forEach(y=>add(new T.TorusGeometry(14.3,.07,6,90),0xC79A62,[0,y,0],null,[PI/2,0,0],false));
    // 池・木・小屋・干し草・花
    add(new T.CylinderGeometry(3,3,.1,40),0x5AA6E6,[-6.5,.02,-4.5],[1,1,.7],null,false);add(new T.TorusGeometry(3,.25,6,40),0x9AA0A8,[-6.5,.05,-4.5],[1,.7,1],[PI/2,0,0],false);
    [[-10.5,-6.5],[10,-8],[11.8,1.5],[-11.5,4],[3,-11.4]].forEach(([x,z],i)=>{add(new T.CylinderGeometry(.35,.5,2.4,10),0x7A5533,[x,1.2,z]);add(new T.SphereGeometry(1.9,18,14),i%2?0x4E9A3A:0x5EB04A,[x,3.4,z]);add(new T.SphereGeometry(1.3,16,12),0x6CC45A,[x+.8,4.2,z+.4]);});
    add(new T.BoxGeometry(4.4,3,3.4),0xC0453A,[6.5,1.5,-8]);const roof=add(new T.CylinderGeometry(2.6,2.6,3.8,3),0x6E2A2A,[6.5,3.6,-8],[1,1,.85],[0,0,PI/2]);roof.rotation.y=PI/2;roof.rotation.set(PI/2,0,PI/2);
    add(new T.BoxGeometry(1.6,2,.12),0xF4EFE6,[6.5,1,-6.27],null,null,false);
    add(new T.CylinderGeometry(.9,.9,1.4,16),0xE8C86A,[9.3,.7,-4.6],null,[PI/2,0,.3]);
    for(let i=0;i<26;i++){const a=i*2.39,r=4+((i*53)%90)/10;const x=Math.cos(a)*r,z=Math.sin(a)*r;if(Math.hypot(x+6.5,z+4.5)<3.6||Math.hypot(x-6.5,z+8)<3.5)continue;add(new T.SphereGeometry(.16,8,6),[0xFFE27A,0xFFFFFF,0xF7A9C8][i%3],[x,.12,z],null,null,false);}
    // モンスター
    const list=[...S.roster].sort((a,b)=>b.lv-a.lv||SP[b.sp].ikai-SP[a.sp].ikai).slice(0,6);
    const ok=(x,z)=>Math.hypot(x,z)<11.5&&Math.hypot(x+6.5,z+4.5)>3.8&&Math.hypot(x-6.5,z+8)>3.6&&Math.hypot(x-9.3,z+4.6)>1.6;
    const rp=()=>{for(let i=0;i<50;i++){const x=(Math.random()*2-1)*11,z=(Math.random()*2-1)*11;if(ok(x,z))return[x,z];}return[0,2];};
    const mons=list.map((m,i)=>{const id=m.sp,obj=buildModel(id),s=.2+.075*MD[id][2];obj.scale.setScalar(s);const[x,z]=rp();obj.position.set(x,0,z);obj.userData.uid=m.uid;sc.add(obj);
      return{obj,uid:m.uid,x,z,tx:x,tz:z,idle:Math.random()*2,spd:1.3+Math.random()*1.2,ph:Math.random()*6,fly:MD[id][3],face:Math.random()*6};});

    rd.domElement.addEventListener('pointerup',e=>{if(!down||Math.hypot(e.clientX-down.x,e.clientY-down.y)>10)return;const r=rd.domElement.getBoundingClientRect();v2.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(v2,cam);
      const hits=ray.intersectObjects(mons.map(m=>m.obj),true);if(!hits.length)return;let o=hits[0].object;while(o&&o.userData.uid==null)o=o.parent;if(!o)return;const mon=monBy(o.userData.uid);if(!mon)return;

      se('tap');const mm=mons.find(x=>x.uid===mon.uid);if(mm){mm.idle=1.6;mm.hop=.5;}});
    RANCH={rd,sc,cam,raf:0};let last=performance.now();
    const tick=()=>{if(!box.isConnected){stopRanch();return;}
      const now=performance.now(),dt=Math.min(.05,(now-last)/1000),t=now/1000;last=now;
      cam.position.set(Math.sin(t*.12)*3,21,27);cam.lookAt(0,-.5,-1);
      for(const m of mons){
        if(m.idle>0){m.idle-=dt;if(m.idle<=0){const[x,z]=rp();m.tx=x;m.tz=z;}}
        else{const dx=m.tx-m.x,dz=m.tz-m.z,dd=Math.hypot(dx,dz);if(dd<.25){m.idle=1+Math.random()*3;}else{m.x+=dx/dd*m.spd*dt;m.z+=dz/dd*m.spd*dt;const want=Math.atan2(dx,dz);let df=want-m.face;df=Math.atan2(Math.sin(df),Math.cos(df));m.face+=df*Math.min(1,dt*6);}}
        const moving=m.idle<=0;let y=m.fly?.8+Math.sin(t*2+m.ph)*.3:(moving?Math.abs(Math.sin(t*9+m.ph))*.25:0);

}

const PARTY_MAX=5,SLOT_MAX=5,SLOTW={S:1,M:2,L:3};
function partyFit(list){const out=[];let u=0;for(const id of list){const m=monBy(id);if(!m)continue;const w=SLOTW[SP[m.sp].size];if(u+w>SLOT_MAX)continue;out.push(id);u+=w;}return out;}
function chooseParty(w){
  let sel=partyFit(S.lastParty||[]);if(!sel.length)sel=partyFit(S.roster.map(m=>m.uid));
  const used=()=>sel.reduce((a,u)=>a+SLOTW[SP[monBy(u).sp].size],0);
  const ov=sheet('<div id="pty"></div>');const box=ov.querySelector('#pty');
  const draw=()=>{const list=[...S.roster].sort((a,b)=>SP[b.sp].ikai-SP[a.sp].ikai||b.lv-a.lv),u=used();
    box.innerHTML=`<h2>出撃パーティ（枠 ${u}/${SLOT_MAX}）</h2><p class="lead">WAVE ${w} から出撃します。Sサイズは1枠、Mサイズは2枠、Lサイズは3枠を使い、合計${SLOT_MAX}枠まで編成できます。このエンドレスが終わるまでパーティは変えられません。</p>
    <div class="slotbar">${Array.from({length:SLOT_MAX},(_,i)=>`<i class="${i<u?'on':''}"></i>`).join('')}</div>
    <div class="list">${list.map(m=>{const on=sel.includes(m.uid),wt=SLOTW[SP[m.sp].size];return monCard(m,{cls:on?'sel':'',disabled:!on&&u+wt>SLOT_MAX,note:on?`✓ 出撃・${wt}枠`:`${wt}枠`});}).join('')}</div>
    <div class="row"><button class="btn ghost" data-a="close">やめる</button><button class="btn" data-a="go" ${sel.length?'':'disabled'}>この${sel.length}匹で出撃</button></div>`;
    box.querySelectorAll('.card').forEach(c=>c.onclick=()=>{const id=+c.dataset.uid;if(sel.includes(id))sel=sel.filter(x=>x!==id);else{const wt=SLOTW[SP[monBy(id).sp].size];if(used()+wt>SLOT_MAX){toast('枠が足りません');return;}sel.push(id);}draw();});
    box.querySelector('[data-a=close]').onclick=()=>ov.remove();
    box.querySelector('[data-a=go]').onclick=()=>{S.lastParty=sel.slice();save();ov.remove();startRun(w,sel.slice());};};
  draw();
}

async function fbToken(){
  if(RK.tok&&Date.now()<RK.exp-60000)return RK.tok;
  let a=(S&&S.fbA&&S.fbA.rt)?S.fbA:fbLoad(),r,j;
  if(a&&a.rt){

    if(r.ok){j=await r.json();RK.tok=j.id_token;RK.exp=Date.now()+(+j.expires_in||3600)*1000;RK.uid=j.user_id;fbKeep({rt:j.refresh_token,uid:j.user_id});return RK.tok;}
  }
  r=await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${FB.apiKey}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({returnSecureToken:true})});
  if(!r.ok)throw new Error('auth '+r.status);
  j=await r.json();RK.tok=j.idToken;RK.exp=Date.now()+(+j.expiresIn||3600)*1000;RK.uid=j.localId;fbKeep({rt:j.refreshToken,uid:j.localId});return RK.tok;

async function fbPut(d){

  if(!r.ok)throw new Error('query '+r.status);
  const a=await r.json();
  return a.filter(x=>x.document).map(x=>{const f=x.document.fields||{},o={id:x.document.name.split('/').pop()};for(const k in f)o[k]=fbVal(f[k]);return o;});

  const free=Math.min(3,15-S.roster.length);let sel=[];
  const ov=sheet('<div id="scout"></div>',{lock:true});const box=ov.querySelector('#scout');
  const draw=()=>{box.innerHTML=`<h2>仲間になりたそうなモンスター</h2><p class="lead">連れて帰る子を選んでください（1回に3匹まで・あと${Math.max(0,free-sel.length)}匹・Lv1で加入）。選ばなかった子は帰っていきます。</p>
    <div class="list">${list.map((id,i)=>{const sp=SP[id],on=sel.includes(i);return `<button class="card ${on?'sel':''}" data-i="${i}" data-lp="s:${id}" ${!on&&sel.length>=free?'disabled':''}>${avatar(sp)}<span class="cinfo"><span class="cname">${sp.name}</span><span class="cmeta">${rankL(sp)}・位階${sp.ikai}</span>${tags(sp)}</span><span class="note">${on?'✓ 連れて帰る':''}</span></button>`;}).join('')}</div>
    ${15-S.roster.length<=0?'<div class="notice">手持ちが15匹で満杯です。手持ちから逃がすと連れて帰れます。</div>':''}
    <div class="row"><button class="btn" data-a="ok">${sel.length?sel.length+'匹を連れて帰る':'誰も連れて帰らない'}</button></div>`;
    box.querySelectorAll('[data-i]').forEach(c=>c.onclick=()=>{const i=+c.dataset.i;sel=sel.includes(i)?sel.filter(x=>x!==i):sel.concat(i);draw();});
    box.querySelector('[data-a=ok]').onclick=()=>{sel.forEach(i=>{S.roster.push({uid:S.nextUid++,sp:list[i],lv:1,exp:0});dexMark(list[i],2);});save();ov.remove();renderBase();if(sel.length){se('new');toast(`${sel.length}匹が仲間になった！`);}};};
  draw();
}

const EQS=[{n1:'木の剣',n2:'革の盾',base:120},{n1:'鉄の剣',n2:'鉄の盾',base:400},{n1:'銀の剣',n2:'銀の盾',base:1200},{n1:'金の剣',n2:'金の盾',base:3000},{n1:'星の剣',n2:'星の盾',base:7000}];
const eqTotal=k=>Object.values(S.eq).reduce((a,v)=>a+(v[k]||0),0);
function keepScroll(fn){
  const els=[document.scrollingElement||document.documentElement,...document.querySelectorAll('main,.main,#main,.scroll,.body')].filter(Boolean);
  const all=new Set(els);document.querySelectorAll('*').forEach(el=>{if(el.scrollTop>0)all.add(el);});
  const pos=[...all].map(el=>[el,el.scrollTop,el.id||el.className]);fn();
  const restore=()=>pos.forEach(([el,t,key])=>{let tg=el;if(!el.isConnected){tg=(key&&document.getElementById(key))||(typeof key==='string'&&key?document.querySelector('.'+key.trim().split(/\s+/).join('.')):null);}if(tg)tg.scrollTop=t;});
  restore();requestAnimationFrame(restore);
}

function pasList(m){const L=[PS(m.sp)];if(m.inh&&SKD[m.inh])L.push(PS(m.inh));return L;}
const starOf=lv=>lv>=30?3:lv>=20?2:lv>=10?1:0;
const STARF={slowAll:'b',haste:'a',strike:'a',healAll:'a',stopAll:'a',curseAll:'a',blast:'a',meteor:'a',volley:'b',guard:'a',push:'a',poisonAll:'a',burnAll:'a',rally:'a',revive:'a',reap:'a'};
const STARCAP={healAll:.9,revive:1,reap:.6};
function ASx(id,lv){const k=AS(id),s=starOf(lv||1);if(!s)return k;const o=Object.assign({},k),f=STARF[k.t];o[f]=+(k[f]*(1+.15*s)).toFixed(2);if(STARCAP[k.t])o[f]=Math.min(STARCAP[k.t],o[f]);o.ct=+(k.ct*(1-.1*s)).toFixed(1);o.star=s;return o;}
const starTxt=s=>s?'★'.repeat(s):'';

function tut(key,then){

  S.tut[key]=1;save();const pages=TUT[key];let i=0;
  const prev=G&&G.phase;if(G&&(prev==='fight'||prev==='between'))G.phase='talk';
  const ov=document.createElement('div');ov.className='tut';
  const end=()=>{ov.remove();if(G&&G.phase==='talk'&&prev)G.phase=prev;if(then)then();};
  const draw=()=>{const[t,b]=pages[i];ov.innerHTML=`<div class="tcard"><img class="tguide" src="${spriteURL(100)}" alt=""><p class="ttl pix">${nm(t)}</p><p class="tbody">${nm(b)}</p>

function useMag(uid){
  const m=monBy(uid);if(!m)return;const cap=Math.min(lvCap(m),MAG_CAP);
  if(S.items.mag<=0){toast('勾玉を持っていません');return;}if(m.lv>=cap){toast(`勾玉はLv${cap}まで使えます`);return;}
  S.items.mag--;m.lv++;m.exp=0;save();se('lvup');toast(`${SP[m.sp].name}がLv${m.lv}になった！`);document.querySelectorAll('.ov').forEach(o=>o.remove());showDetail(uid);if(screen==='base')renderBase();
}
function useStick(uid){
  const m=monBy(uid);if(!m)return;const L=(m.parents||[]).filter(id=>id!==m.sp&&SKD[id]);

function updAmb(dt){
  const B=G.biome,A=G.amb;const rate={leaf:1.2,dust:4,firefly:2.5,sand:10,bubble:3,snow:12,ember:7,spark:5,redember:8}[B.fx]||0;
  G.ambAcc=(G.ambAcc||0)+rate*dt;
  while(G.ambAcc>1&&A.length<90){G.ambAcc-=1;const p={x:Math.random()*360,y:Math.random()*560,t:0,life:4+Math.random()*4,ph:Math.random()*6};
    if(B.fx==='snow'||B.fx==='dust'||B.fx==='leaf')p.y=-10;if(B.fx==='ember'||B.fx==='redember'||B.fx==='bubble')p.y=570;if(B.fx==='sand')p.x=-10;
    if(B.fx==='bubble'&&G.deco.length){const d=G.deco[Math.floor(Math.random()*G.deco.length)];p.x=d.x-4+Math.random()*8;p.y=d.y;p.life=1.4;}
    A.push(p);}
  for(const p of A){p.t+=dt;const f=B.fx;
    if(f==='snow'){p.y+=34*dt;p.x+=Math.sin(p.t*2+p.ph)*14*dt;}else if(f==='dust'){p.y+=14*dt;p.x+=Math.sin(p.t+p.ph)*5*dt;}else if(f==='leaf'){p.y+=26*dt;p.x+=Math.sin(p.t*2+p.ph)*24*dt;}
    else if(f==='sand'){p.x+=150*dt;p.y+=Math.sin(p.t*3+p.ph)*8*dt;}else if(f==='ember'||f==='redember'){p.y-=40*dt;p.x+=Math.sin(p.t*3+p.ph)*12*dt;}
    else if(f==='bubble'){p.y-=12*dt;}else{p.x+=Math.sin(p.t*1.3+p.ph)*16*dt;p.y+=Math.cos(p.t*1.1+p.ph)*12*dt;}}
  G.amb=A.filter(p=>p.t<p.life&&p.y>-20&&p.y<600&&p.x<380);
}

/* ============ 戦闘演出 ============ */
function pt(x,y,vx,vy,life,s,c,k,g){if(G.pt.length>900)return;G.pt.push({x,y,vx,vy,t:life,max:life,s,c,k:k||'dot',g:g||0});}
function burst(x,y,c,n,spd,k,life,g){for(let i=0;i<n;i++){const a=Math.random()*TAU,v=spd*(.35+Math.random()*.85);pt(x,y,Math.cos(a)*v,Math.sin(a)*v-spd*.15,(life||.45)*(.7+Math.random()*.6),2+Math.random()*2.5,c,k,g);}}
function updFx(rdt){
  const fdt=rdt*Math.min(G.speed,2);
  for(const p of G.pt){p.t-=fdt;p.x+=p.vx*fdt;p.y+=p.vy*fdt;p.vy+=p.g*fdt;p.vx*=.97;}G.pt=G.pt.filter(p=>p.t>0);
  for(const f of G.fx){
    if(f.k==='proj'){f.p+=fdt/f.dur;if(f.p<0)continue;const x=f.x1+(f.x2-f.x1)*f.p,y=f.y1+(f.y2-f.y1)*f.p-Math.sin(f.p*Math.PI)*f.arc;f.x=x;f.y=y;
      if(f.e==='火'&&Math.random()<.8)pt(x,y,0,-10,.25,2.5,Math.random()<.5?'#FFB13B':'#FF5A1F');
      if(f.e==='闇'&&Math.random()<.6)pt(x,y,0,0,.25,2.5,'#5A2A7A');
      if(f.e==='光'&&Math.random()<.5)pt(x,y,0,0,.2,2,'#FFF3B0');
      if(f.p>=1){f.t=0;burst(f.x2,f.y2,f.c,f.big?14:7,f.big?110:70,'dot',.35);if(f.big)G.shake=Math.max(G.shake,.25);}}
    else if(f.k==='meteor'){f.p+=fdt/f.dur;if(f.p<1){const x=f.x+70*(1-f.p),y=f.y-240*(1-f.p);pt(x,y,0,0,.3,4,Math.random()<.5?'#FFE27A':'#FFFFFF','star');}else{f.t=0;burst(f.x,f.y,'#FFE27A',16,140,'star',.5);burst(f.x,f.y,'#FFFFFF',8,80,'dot',.4);G.shake=Math.max(G.shake,.3);}}
    else if(f.k==='orbfly'){f.p+=rdt/f.dur;if(f.p>=1)f.t=0;}
  }
  if(G.shake>0)G.shake=Math.max(0,G.shake-rdt);
  if(G.flashW>0)G.flashW=Math.max(0,G.flashW-rdt*2.5);
  if(G.flashR>0)G.flashR=Math.max(0,G.flashR-rdt*1.2);
  if(G.cutin){G.cutin.t-=rdt;if(G.cutin.t<=0)G.cutin=null;}
  for(const d of G.deployed)if(d.dash>0)d.dash=Math.max(0,d.dash-fdt);
}
/* ===== スキル演出（ド派手版） ===== */
function sfx(o){if(!G)return;(G.sfx||(G.sfx=[])).push(Object.assign({t:o.dur||.6,max:o.dur||.6},o));}
function later(t,fn){if(!G)return;(G.later||(G.later=[])).push({t,fn});}
const easeO=p=>1-Math.pow(1-p,3);
const ELPAL={'火':['#FFE36B','#FF9F2B','#FF4A1F'],'水':['#E2F6FF','#6CC6FF','#2B6FD8'],'風':['#F2FFE0','#9BE38A','#3FAF5A'],'土':['#FFE7B0','#D69A4B','#8A5A2B'],'光':['#FFFFFF','#FFF3B0','#FFD34D'],'闇':['#F0D8FF','#B07BFF','#5A2A9A']};
function updSfx(rdt){
  if(!G)return;const d=rdt*Math.min(G.speed,2);
  if(G.sfx){for(const f of G.sfx){f.t-=d;const p=1-Math.max(0,f.t)/f.max;
      if(f.k==='stream'&&f.t>0){const pal=ELPAL[f.el]||ELPAL['光'];for(let i=0;i<7;i++){const a=Math.atan2(f.y2-f.y1,f.x2-f.x1)+(Math.random()-.5)*.35,v=320+Math.random()*160;pt(f.x1,f.y1,Math.cos(a)*v,Math.sin(a)*v,.32,3+Math.random()*3.5,pal[Math.floor(Math.random()*3)],Math.random()<.3?'star':'dot');}}
      if(f.k==='aura'&&f.t>0){for(let i=0;i<3;i++)pt(f.x+(Math.random()-.5)*34,f.y+8,(Math.random()-.5)*16,-90-Math.random()*90,.8,2.5+Math.random()*2.5,Math.random()<.5?f.c:'#FFFFFF',Math.random()<.4?'plus':'star');}
      if(f.k==='fall'&&f.t>0){const q=easeO(Math.min(1,p)),hx=f.x+(f.sx-f.x)*(1-q),hy=f.y+(f.sy-f.y)*(1-q);for(let i=0;i<4;i++)pt(hx+(Math.random()-.5)*8,hy+(Math.random()-.5)*8,(Math.random()-.5)*30,-20,.35,4+Math.random()*4,f.ft==='dark'?(i%2?'#B07BFF':'#3A1A5A'):f.ft==='star'?(i%2?'#FFFFFF':'#FFE36B'):(i%2?'#FFE36B':'#FF7A2B'),f.ft==='star'&&i%2?'star':'dot');}}
    G.sfx=G.sfx.filter(f=>f.t>0);}

}
function drawSfx(now){

    const g=ctx.createLinearGradient(0,0,360,0);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(.15,'rgba(20,14,36,.92)');g.addColorStop(.85,'rgba(20,14,36,.92)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(0,y-46,360,92);
    ctx.fillStyle=G.pcut.c;ctx.fillRect(0,y-48,360,3);ctx.fillRect(0,y+45,360,3);
    const sx=((p*1.6)%1)*520-80;const sg=ctx.createLinearGradient(sx-40,0,sx+40,0);sg.addColorStop(0,'rgba(255,255,255,0)');sg.addColorStop(.5,'rgba(255,255,255,.35)');sg.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=sg;ctx.fillRect(0,y-46,360,92);

    const sc2=1+(1-sl)*.6;ctx.translate(180,y+10);ctx.scale(sc2,sc2);ctx.font='34px "DotGothic16",monospace';ctx.lineWidth=6;ctx.strokeStyle='rgba(0,0,0,.7)';ctx.strokeText(G.pcut.n,0,0);ctx.fillStyle=G.pcut.c;ctx.fillText(G.pcut.n,0,0);ctx.fillStyle='rgba(255,255,255,.35)';ctx.fillText(G.pcut.n,0,-2);ctx.restore();}
}

/* ============ 描画 ============ */
function draw(){if(!G||!ctx)return;const dpr=window.devicePixelRatio||1;ctx.setTransform(scale*dpr,0,0,scale*dpr,0,0);
  const vh=G.viewH||560;ctx.fillStyle='#2B2540';ctx.fillRect(0,0,360,vh);
  ctx.save();ctx.translate(0,-(G.camY||0));if(G.shake>0)ctx.translate((Math.random()-.5)*G.shake*14,(Math.random()-.5)*G.shake*14);drawScene();ctx.restore();
  drawSfxScreen(vh);ctx.save();ctx.translate(0,vh/2-280);drawCutin();drawBanner();ctx.restore();drawPSScreen(performance.now()/1000,vh);
  if(G.flashW>0){ctx.fillStyle='rgba(255,255,240,'+(G.flashW*.5)+')';ctx.fillRect(0,0,360,vh);}
  if(G.mode==='arena'){const t=Math.ceil(G.arenaT);ctx.fillStyle='rgba(43,37,64,.8)';ctx.fillRect(130,6,100,26);ctx.fillStyle=t<=10?'#FF6B6B':'#FFE27A';ctx.font='18px "DotGothic16",monospace';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('⏱ '+t,180,20);}
  if(G.flashR>0){ctx.fillStyle='rgba(220,20,50,'+(G.flashR*.35*(.6+.4*Math.sin(performance.now()/60)))+')';ctx.fillRect(0,0,360,vh);}
  if(G.camMax>0){ctx.fillStyle='rgba(255,255,255,.75)';ctx.font='bold 12px sans-serif';ctx.textAlign='center';if(G.camY>2)ctx.fillText('▲',350,14);if(G.camY<G.camMax-2)ctx.fillText('▼',350,vh-8);}
}
function drawScene(){
  if(!G||!ctx)return;ctx.imageSmoothingEnabled=false;const M=G.map,now=performance.now()/1000;
  drawBiomeBG();
  // 道
  ctx.lineJoin='round';ctx.lineCap='round';
  const path=()=>{ctx.beginPath();ctx.moveTo(M.pts[0][0],M.pts[0][1]);for(const p of M.pts)ctx.lineTo(p[0],p[1]);};
  path();ctx.strokeStyle=G.biome.p1;ctx.lineWidth=50;ctx.stroke();
  path();ctx.strokeStyle=G.biome.p2;ctx.lineWidth=42;ctx.stroke();drawPathTiles();
  // 出現口
  const[sx]=M.pts[0];ctx.fillStyle='#2E2638';ctx.beginPath();ctx.ellipse(sx,0,26,16,0,0,Math.PI);ctx.fill();
  drawDeco(now);
  // 馬車
  {ctx.save();ctx.translate(180,560);ctx.scale(1.25,1.25);ctx.translate(-180,-560);const hit=G.flash>0,ol='#3D2A1A';
  ctx.fillStyle='rgba(0,0,0,.28)';ctx.beginPath();ctx.ellipse(180,556,50,8,0,0,TAU);ctx.fill();
  const wheel=(x,y,r)=>{ctx.fillStyle='#4A3220';ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();ctx.strokeStyle='#C9A26A';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,r-2.5,0,TAU);ctx.stroke();
    for(let k=0;k<4;k++){const a=k*Math.PI/4;ctx.beginPath();ctx.moveTo(x-Math.cos(a)*(r-3),y-Math.sin(a)*(r-3));ctx.lineTo(x+Math.cos(a)*(r-3),y+Math.sin(a)*(r-3));ctx.stroke();}ctx.fillStyle='#C9A26A';ctx.beginPath();ctx.arc(x,y,2.5,0,TAU);ctx.fill();};
  wheel(144,540,13);wheel(216,540,13);
  ctx.fillStyle=hit?'#D46A5A':'#8B5A2B';ctx.fillRect(138,516,84,26);ctx.strokeStyle=ol;ctx.lineWidth=2;ctx.strokeRect(138,516,84,26);
  ctx.strokeStyle='rgba(61,42,26,.6)';ctx.lineWidth=1;[524,532].forEach(y=>{ctx.beginPath();ctx.moveTo(139,y);ctx.lineTo(221,y);ctx.stroke();});
  ctx.fillStyle=hit?'#FFD4CC':'#F4ECD6';ctx.beginPath();ctx.moveTo(141,518);ctx.bezierCurveTo(138,470,222,470,219,518);ctx.closePath();ctx.fill();ctx.strokeStyle=ol;ctx.lineWidth=2;ctx.stroke();
  ctx.strokeStyle='#C9B48A';ctx.lineWidth=1.5;[160,180,200].forEach(x=>{ctx.beginPath();ctx.moveTo(x,517);ctx.quadraticCurveTo(x,486-Math.abs(x-180)*.2,x,482+Math.abs(x-180)*.35);ctx.stroke();});
  ctx.fillStyle='#FFE27A';ctx.beginPath();for(let k=0;k<10;k++){const a=-Math.PI/2+k*Math.PI/5,r=k%2?3.5:8;ctx.lineTo(180+Math.cos(a)*r,497+Math.sin(a)*r);}ctx.closePath();ctx.fill();ctx.strokeStyle='#B8860B';ctx.lineWidth=1;ctx.stroke();
  wheel(150,544,10);wheel(210,544,10);
  ctx.strokeStyle='#5A3E24';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(176,516);ctx.lineTo(172,500);ctx.moveTo(184,516);ctx.lineTo(188,500);ctx.stroke();
  ctx.restore();}
  // マス
  const place=G.phase==='place';const selSp=selUid!=null?SP[monBy(selUid).sp]:null;
  G.map.spots.forEach((s,i)=>{
    const occ=G.deployed.some(d=>d.spot===i);
    const ok=selSp&&SZN[selSp.size]<=SZN[s.size];
    ctx.beginPath();ctx.arc(s.x,s.y,s.r+3,0,Math.PI*2);
    ctx.fillStyle=place&&ok?'rgba(255,226,122,.35)':'rgba(255,255,255,.14)';ctx.fill();
    ctx.setLineDash([5,4]);ctx.lineWidth=2;ctx.strokeStyle=place&&ok?'#FFE27A':'rgba(255,255,255,.55)';ctx.stroke();ctx.setLineDash([]);
    if(!occ){ctx.fillStyle=place&&selSp&&!ok?'rgba(255,255,255,.3)':'rgba(255,255,255,.85)';ctx.font='bold 16px "M PLUS Rounded 1c",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(s.size,s.x,s.y+1);}
  });
  // 射程（配置中に選んだモンスター）
  if(place){
    const ring=(x,y,r,fill,stroke,w)=>{ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();ctx.setLineDash([6,5]);ctx.strokeStyle=stroke;ctx.lineWidth=w;ctx.stroke();ctx.setLineDash([]);};
    for(const d of G.deployed){const m=monBy(d.uid);if(!m)continue;const[x,y]=allyPos(d),sel=d.uid===selUid;ring(x,y,allyStats(SP[m.sp],m.lv,m).range,sel?'rgba(255,226,122,.16)':'rgba(255,255,255,.07)',sel?'rgba(255,226,122,.95)':'rgba(255,255,255,.45)',sel?2.2:1.5);}
    if(selUid!=null&&!G.deployed.some(d=>d.uid===selUid)){const m=monBy(selUid),rr=allyStats(selSp,m.lv,m).range;
      G.map.spots.forEach((s,i)=>{if(G.deployed.some(d=>d.spot===i)||SZN[selSp.size]>SZN[s.size])return;ctx.beginPath();ctx.arc(s.x,s.y,rr,0,Math.PI*2);ctx.setLineDash([4,6]);ctx.strokeStyle='rgba(255,226,122,.35)';ctx.lineWidth=1.2;ctx.stroke();ctx.setLineDash([]);});}
  }
  if(S.cfg.range&&G.phase!=='place')for(const d of G.deployed){if(G.rs[d.uid].down>0)continue;const m=monBy(d.uid),[x,y]=allyPos(d);ctx.beginPath();ctx.arc(x,y,allyStats(SP[m.sp],m.lv,m).range,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,.07)';ctx.fill();ctx.setLineDash([6,5]);ctx.strokeStyle='rgba(255,255,255,.45)';ctx.lineWidth=1.5;ctx.stroke();ctx.setLineDash([]);}
  // モンスター（地上→飛行の順、奥から手前）
  const units=[];
  for(const d of G.deployed){
    const m=monBy(d.uid),sp=SP[m.sp],rs=G.rs[d.uid],st=allyStats(sp,m.lv,m);const[x,y]=allyPos(d);
    const disp=44*monScale(sp),fly=monFly(sp),gy=y+10;
    units.push({gy,fly,f:()=>{
      const dk=d.dash>0?Math.sin((1-d.dash/.35)*Math.PI)*.75:0,x=allyPos(d)[0]+(d.dx||0)*dk,y=allyPos(d)[1]+(d.dy||0)*dk;
      if(G.guardT>0){ctx.strokeStyle='rgba(127,211,255,'+(.45+.25*Math.sin(now*6))+')';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(x,gy-disp*.4,disp*.45,0,Math.PI*2);ctx.stroke();}
      if(G.rallyT>0){ctx.fillStyle='rgba(255,90,90,.18)';ctx.beginPath();ctx.ellipse(x,gy,disp*.45,disp*.16,0,0,Math.PI*2);ctx.fill();}
      if(rs.rapidT>0){ctx.strokeStyle='rgba(255,120,40,'+(.5+.4*Math.sin(now*14))+')';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(x,gy,disp*.42,disp*.15,0,0,Math.PI*2);ctx.stroke();}
      const lift=fly?10+disp*.22+Math.sin(now*2.6+d.uid)*3:Math.max(0,Math.sin(now*3+d.uid))*1.5;
      ctx.fillStyle='rgba(0,0,0,'+(fly?.14:.24)+')';ctx.beginPath();ctx.ellipse(x,gy,disp*(fly?.26:.34),disp*.1,0,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle=ELEMC[sp.elem];ctx.lineWidth=2.2;ctx.beginPath();ctx.ellipse(x,gy,Math.max(12,disp*.3),Math.max(4,disp*.1),0,0,Math.PI*2);ctx.stroke();
      const top=gy-disp*.925-lift;
      ctx.globalAlpha=rs.down>0?.35:1;
      ctx.save();ctx.translate(x,0);ctx.scale(d.face||1,1);ctx.drawImage(sprite(sp.id),-disp/2,top,disp,disp);ctx.restore();
      ctx.globalAlpha=1;ctx.textAlign='center';ctx.textBaseline='middle';
      const by=top+disp*.14,bw=Math.min(52,Math.max(30,disp*.55));
      if(rs.down>0){ctx.fillStyle='#fff';ctx.font='bold 12px "M PLUS Rounded 1c",sans-serif';ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,.6)';ctx.strokeText(Math.ceil(rs.down)+'秒',x,by);ctx.fillText(Math.ceil(rs.down)+'秒',x,by);}
      else bar(x-bw/2,by-3,bw,5,rs.hp/st.hp,'#5BD17E');
      ctx.fillStyle='#fff';ctx.font='12px "DotGothic16",monospace';ctx.lineWidth=2.5;ctx.strokeStyle='rgba(0,0,0,.55)';ctx.strokeText('Lv'+m.lv,x,gy+11);ctx.fillText('Lv'+m.lv,x,gy+11);
    }});
  }
  for(const e of G.enemies){
    const gy=e.y+6;
    units.push({gy,fly:e.fly,f:()=>{
      const disp=e.disp*(e.hitT>0?1.07:1),lift=e.fly?10+e.disp*.22+Math.sin(now*3+e.max)*3:Math.abs(Math.sin(now*7+e.max))*2;
      ctx.fillStyle=e.fly?'rgba(80,10,20,.18)':'rgba(120,20,30,.3)';ctx.beginPath();ctx.ellipse(e.x,gy,e.disp*(e.fly?.26:.34),e.disp*.1,0,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle=e.boss?'#FF3B4E':'#D9434F';ctx.lineWidth=e.boss?3:2;ctx.beginPath();ctx.ellipse(e.x,gy,Math.max(10,e.disp*.3),Math.max(4,e.disp*.1),0,0,Math.PI*2);ctx.stroke();
      if(e.slow>0){ctx.fillStyle=e.slowMul<.6?'rgba(124,224,122,.45)':'rgba(120,190,255,.4)';ctx.beginPath();ctx.ellipse(e.x,gy,e.disp*.4,e.disp*.15,0,0,Math.PI*2);ctx.fill();}
      if(e.curseT>0){ctx.strokeStyle='rgba(180,90,255,.85)';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(e.x,gy,e.disp*.36,e.disp*.13,now*3,0,Math.PI*1.5);ctx.stroke();}
      const top=gy-disp*.925-lift;e.top=top+disp*.15;
      ctx.save();ctx.translate(e.x,0);ctx.scale(e.face,1);ctx.drawImage(sprite(e.sp.id),-disp/2,top,disp,disp);ctx.restore();
      if(e.hitT>0){ctx.globalAlpha=.55;ctx.globalCompositeOperation='lighter';ctx.save();ctx.translate(e.x,0);ctx.scale(e.face,1);ctx.drawImage(sprite(e.sp.id),-disp/2,top,disp,disp);ctx.restore();ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;}
      if(e.stopT>0){ctx.strokeStyle='#C9C3D6';ctx.lineWidth=3;for(let i=-1;i<=1;i++){ctx.beginPath();ctx.moveTo(e.x+i*e.disp*.18,top+disp*.3);ctx.lineTo(e.x+i*e.disp*.18,gy);ctx.stroke();}ctx.beginPath();ctx.moveTo(e.x-e.disp*.3,top+disp*.3);ctx.lineTo(e.x+e.disp*.3,top+disp*.3);ctx.stroke();}
      const bw=Math.min(52,Math.max(26,e.disp*.5));bar(e.x-bw/2,e.top-2,bw,4,e.hp/e.max,e.poison>0?'#9BE15D':'#FF6B6B');drawStatus(e,e.top-2);
    }});
  }
  units.sort((a,b)=>(a.fly-b.fly)||(a.gy-b.gy));units.forEach(u=>u.f());

  // エフェクト
  for(const f of G.fx){
    if(f.k==='shot'){ctx.globalAlpha=Math.min(1,f.t/.1);ctx.strokeStyle=f.c;ctx.lineWidth=f.w;ctx.beginPath();ctx.moveTo(f.x1,f.y1);ctx.lineTo(f.x2,f.y2);ctx.stroke();}

    else if(f.k==='text'){ctx.globalAlpha=Math.min(1,f.t*2);ctx.fillStyle=f.color;ctx.font='800 '+(f.size||13)+'px "M PLUS Rounded 1c",sans-serif';ctx.textBaseline='middle';ctx.textAlign='center';ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,.6)';ctx.strokeText(f.text,f.x,f.y);ctx.fillText(f.text,f.x,f.y);}
    else if(f.k==='orb'){ctx.globalAlpha=Math.min(1,f.t*2);const c={g:'#4FA45E',y:'#D9A92B',r:'#D2533F'}[f.c];ctx.beginPath();ctx.arc(f.x,f.y-(1-f.t)*30,7,0,Math.PI*2);ctx.fillStyle=c;ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();}
    ctx.globalAlpha=1;
  }
  drawAmb();
}
function drawBanner(){
  if(G.banner){
    ctx.globalAlpha=Math.min(1,G.banner.t*2);ctx.fillStyle=G.banner.warn?'rgba(150,16,36,.88)':'rgba(43,37,64,.82)';ctx.fillRect(0,240,360,64);if(G.banner.warn){const o=(performance.now()/20)%28;ctx.fillStyle='#FFE27A';for(let i=-1;i<14;i++){const x=i*28-o;ctx.beginPath();ctx.moveTo(x,240);ctx.lineTo(x+14,240);ctx.lineTo(x+8,246);ctx.lineTo(x-6,246);ctx.fill();ctx.beginPath();ctx.moveTo(x,304);ctx.lineTo(x+14,304);ctx.lineTo(x+8,298);ctx.lineTo(x-6,298);ctx.fill();}}

  const env=CrazyGames.SDK.environment;if(env!=='crazygames'&&env!=='local')return;CGS=CrazyGames.SDK;
