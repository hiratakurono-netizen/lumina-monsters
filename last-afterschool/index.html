<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>さいごの放課後（仮題）プロトタイプ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #07040e; overflow: hidden; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  body { display: flex; align-items: center; justify-content: center; font-family: 'DotGothic16', monospace; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; background: #0b0714; }
  #touch { display: none; position: fixed; inset: 0; pointer-events: none; }
  body.touch #touch { display: block; }
  .btn { position: absolute; pointer-events: auto; border-radius: 50%; border: 2px solid rgba(220,200,255,.55);
    background: rgba(40,28,80,.35); color: #f0e8ff; font-size: 14px; display: flex; align-items: center; justify-content: center;
    width: 64px; height: 64px; touch-action: none; }
  .btn.on { background: rgba(160,130,255,.55); }
  .pad { left: 18px; bottom: 22px; }
  .pad .btn { position: absolute; }
  [data-btn="left"]  { left: 16px;  bottom: 30px; }
  [data-btn="right"] { left: 96px;  bottom: 30px; }
  [data-btn="down"]  { left: 56px;  bottom: 104px; width: 48px; height: 48px; font-size: 12px; }
  [data-btn="attack"]  { right: 96px; bottom: 30px; width: 76px; height: 76px; font-size: 16px; }
  [data-btn="jump"]    { right: 16px; bottom: 60px; }
  [data-btn="kick"]    { right: 176px; bottom: 22px; }
  [data-btn="special"] { right: 110px; bottom: 120px; border-color: rgba(255,226,122,.7); }
  [data-btn="swap"]    { right: 30px; bottom: 140px; width: 50px; height: 50px; font-size: 12px; }
  [data-btn="run"]     { left: 176px; bottom: 30px; width: 52px; height: 52px; font-size: 12px; }
  [data-btn="pause"]   { right: 12px; top: 12px; width: 44px; height: 44px; font-size: 12px; }
</style>
</head>
<body>
<canvas id="game" width="960" height="540"></canvas>
<div id="touch">
  <div class="btn" data-btn="left">◀</div>
  <div class="btn" data-btn="right">▶</div>
  <div class="btn" data-btn="run">ダッシュ</div>
  <div class="btn" data-btn="attack">攻撃</div>
  <div class="btn" data-btn="jump">ジャンプ</div>
  <div class="btn" data-btn="kick">キック</div>
  <div class="btn" data-btn="special">必殺</div>
  <div class="btn" data-btn="swap">武器</div>
  <div class="btn" data-btn="pause">II</div>
</div>
<script src="src/sprite_data.js"></script>
<script src="src/config.js"></script>
<script src="src/audio.js"></script>
<script src="src/input.js"></script>
<script src="src/backgrounds.js"></script>
<script src="src/entities.js"></script>
<script src="src/world.js"></script>
<script src="src/game.js"></script>
</body>
</html>
