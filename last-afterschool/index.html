<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>さいごの放課後</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  /* 単一の暗い世界観で統一（ゲーム画面のためテーマ切替なし） */
  :root {
    --bg: #07040e; --stage: #0b0714; --ink: #f0e8ff; --btn: rgba(40, 28, 80, .38);
    --btn-on: rgba(160, 130, 255, .6); --edge: rgba(220, 200, 255, .55); --gold: rgba(255, 226, 122, .8);
    --b: min(17vh, 78px);
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); overflow: hidden; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  body { font-family: 'DotGothic16', 'Hiragino Sans', monospace; }
  #wrap { position: fixed; top: 0; right: 0; bottom: 0; left: 0; display: flex; align-items: center; justify-content: center;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; background: var(--stage); touch-action: none; }
  #touch { display: none; position: fixed; top: 0; right: 0; bottom: 0; left: 0; pointer-events: none; }
  body.touch #touch { display: block; }
  .btn { position: absolute; pointer-events: auto; box-sizing: border-box; border-radius: 50%; border: 2px solid var(--edge);
    background: var(--btn); color: var(--ink); font: 12px 'DotGothic16', monospace; display: flex; align-items: center;
    justify-content: center; width: var(--b); height: var(--b); touch-action: none; white-space: nowrap; letter-spacing: -.5px; }
  .btn.on { background: var(--btn-on); transform: scale(.94); }
  [hidden] { display: none !important; }
  [data-btn="run"].on { border-color: var(--gold); transform: none; box-shadow: 0 0 12px var(--gold); }
  .btn.sm { width: calc(var(--b) * .7); height: calc(var(--b) * .7); font-size: 10px; }
  .btn.lg { width: calc(var(--b) * 1.2); height: calc(var(--b) * 1.2); font-size: 16px; }
  /* 左手：移動 */
  [data-btn="left"]  { left: calc(10px + env(safe-area-inset-left, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); }
  [data-btn="right"] { left: calc(18px + var(--b) + env(safe-area-inset-left, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); }
  [data-btn="run"]   { left: calc(14px + var(--b) * .65 + env(safe-area-inset-left, 0px)); bottom: calc(24px + var(--b) + env(safe-area-inset-bottom, 0px)); }
  /* 右手：アクション */
  [data-btn="attack"]  { right: calc(16px + var(--b) + env(safe-area-inset-right, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
  [data-btn="jump"]    { right: calc(8px + env(safe-area-inset-right, 0px)); bottom: calc(20px + var(--b) * .7 + env(safe-area-inset-bottom, 0px)); }
  [data-btn="guard"]   { right: calc(8px + env(safe-area-inset-right, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); border-color: rgba(160, 220, 255, .85); }
  [data-btn="kick"]    { right: calc(24px + var(--b) * 2.2 + env(safe-area-inset-right, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
  [data-btn="special"] { right: calc(22px + var(--b) * 1.15 + env(safe-area-inset-right, 0px)); bottom: calc(22px + var(--b) * 1.2 + env(safe-area-inset-bottom, 0px)); border-color: var(--gold); }
  [data-btn="swap"]    { right: calc(14px + env(safe-area-inset-right, 0px)); bottom: calc(40px + var(--b) * 1.5 + env(safe-area-inset-bottom, 0px)); }
  [data-btn="pause"]   { right: calc(10px + env(safe-area-inset-right, 0px)); top: calc(44px + env(safe-area-inset-top, 0px)); border-radius: 10px; }
  #rotate { display: none; position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 5; background: var(--bg); color: var(--ink);
    flex-direction: column; align-items: center; justify-content: center; text-align: center; font-size: 18px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  #rotate > div { margin: 9px 0; }
  #rotate .ph { width: 54px; height: 92px; border: 3px solid var(--ink); border-radius: 10px; animation: rot 2s ease-in-out infinite; }
  @keyframes rot { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
  @media (prefers-reduced-motion: reduce) { #rotate .ph { animation: none; transform: rotate(-90deg); } }
  @media (orientation: portrait) { body.touch #rotate { display: flex; } }
  /* ---- 町のメニュー（HTML で重ねる） ---- */
  #ui { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
    padding: max(8px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(8px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  .ui-backdrop { position: absolute; top: 0; right: 0; bottom: 0; left: 0; background: rgba(6, 3, 12, .62); }
  .ui-panel { position: relative; display: flex; flex-direction: column; width: 100%; max-width: 760px; max-height: 100%;
    background: #160f2a; border: 2px solid #b9a2ff; box-shadow: 0 0 0 4px rgba(185, 162, 255, .12); color: var(--ink); font-family: 'DotGothic16', monospace; }
  .ui-head { display: flex; flex-shrink: 0; align-items: center; gap: 10px; padding: 8px 8px 8px 16px; border-bottom: 1px solid #3b2d63; }
  .ui-title { font-size: 20px; color: #ffe9a8; flex: 1; }
  .ui-head-right { font-size: 15px; color: #ffe27a; }
  .ui-close { min-width: 44px; min-height: 44px; font: inherit; font-size: 18px; color: var(--ink); background: #2a2140; border: 1px solid #5a4d86; border-radius: 8px; }
  .ui-tabs { display: flex; flex-shrink: 0; gap: 4px; padding: 6px 8px 0; overflow-x: auto; }
  .ui-tab { flex: 1; min-height: 40px; font: inherit; font-size: 15px; color: #cfc3ea; background: #1e1734; border: 1px solid #3b2d63; border-bottom: 0; border-radius: 8px 8px 0 0; white-space: nowrap; }
  .ui-tab.on { color: #ffe9a8; background: #2c2150; border-color: #8f7fd0; }
  .ui-body { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; padding: 10px 12px 14px; display: flex; flex-direction: column; gap: 8px; }
  .ui-row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; min-height: 48px; background: #1e1734; border: 1px solid #3b2d63; border-left: 5px solid var(--rc, #5a4d86); border-radius: 6px; }
  .ui-row.sel { background: #2c2150; border-color: #8f7fd0; }
  .ui-row .main { flex: 1; min-width: 0; }
  .ui-row .name { font-size: 16px; color: var(--rc, #f0e8ff); }
  .ui-row .sub { font-size: 12px; color: #b9aee0; margin-top: 2px; }
  .ui-row .slot { width: 64px; font-size: 13px; color: #9d90c8; }
  .ui-btn { min-width: 64px; min-height: 44px; padding: 0 12px; font: inherit; font-size: 15px; color: #160f2a; background: #ffe27a; border: 0; border-radius: 8px; }
  .ui-btn.ghost { color: var(--ink); background: #2a2140; border: 1px solid #5a4d86; }
  .ui-btn:disabled { opacity: .4; }
  .ui-note { font-size: 13px; color: #b9aee0; line-height: 1.6; }
  .ui-h { font-size: 14px; color: #ffe9a8; margin-top: 4px; }
  .ui-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 6px; }
  .ui-stat { padding: 8px 10px; background: #1e1734; border: 1px solid #3b2d63; border-radius: 6px; font-size: 14px; }
  .ui-stat b { display: block; font-size: 18px; color: #ffe9a8; font-weight: normal; }
  .up { color: #8fe0a0; } .down { color: #ff8a9a; }
  .ui-new { margin-left: 8px; padding: 1px 6px; font-size: 11px; color: #160f2a; background: #ff9ec0; border-radius: 4px; vertical-align: middle; }
  .ui-text { width: 100%; min-height: 72px; font: 12px monospace; color: var(--ink); background: #0c0818; border: 1px solid #5a4d86; border-radius: 6px; padding: 6px; box-sizing: border-box; -webkit-user-select: text; user-select: text; }
  .ui-toast { position: fixed; left: 50%; top: 18%; transform: translateX(-50%); z-index: 20; padding: 10px 18px; background: #2c2150; color: #ffe9a8; border: 1px solid #b9a2ff; border-radius: 8px; font: 16px 'DotGothic16', monospace; }
  body.ui-open #touch { display: none; }
  /* 町では戦闘ボタンを隠し、近くに施設がある時だけ「しらべる」を出す */
  body.town [data-btn="attack"], body.town [data-btn="kick"], body.town [data-btn="special"], body.town [data-btn="swap"], body.town [data-btn="guard"] { display: none; }
  /* ダンジョンだけ「道具」ボタンを出す */
  [data-btn="item"] { display: none; right: calc(10px + env(safe-area-inset-right, 0px)); top: calc(52px + var(--b) * .7 + env(safe-area-inset-top, 0px)); border-radius: 10px; border-color: rgba(143, 224, 160, .8); }
  body.dungeon [data-btn="item"] { display: flex; }
  [data-btn="down"] { right: calc(20px + var(--b) * 1.1 + env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: calc(var(--b) * 1.2); height: calc(var(--b) * 1.2); border-color: var(--gold); font-size: 15px; }
  /* ---- 自宅：装備・持ち物（主人公＋装備枠＋アイコン一覧） ---- */
  .ui-panel.wide { max-width: 980px; height: 100%; }
  .home { display: grid; grid-template-columns: minmax(0, .95fr) minmax(0, 1.15fr); gap: 12px; min-height: 0; }
  .home-left, .home-right { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .doll { display: grid; grid-template-columns: 64px minmax(0, 1fr) 64px; grid-template-rows: repeat(3, 64px); gap: 8px 10px; }
  .home { padding-bottom: 6px; }
  .doll .hero { display: flex; align-items: flex-end; justify-content: center; overflow: hidden; border-radius: 10px;
    background: radial-gradient(ellipse at 50% 85%, rgba(185, 162, 255, .35), rgba(185, 162, 255, 0) 65%), #1a1230; border: 1px solid #3b2d63; }
  .doll .hero img { height: 112%; image-rendering: pixelated; margin-bottom: -4%; }
  .tile { position: relative; width: 64px; height: 64px; padding: 4px; display: flex; align-items: center; justify-content: center; font: inherit; color: var(--ink);
    background: linear-gradient(160deg, #2a2148, #1a1230); border: 2px solid var(--rc, #3b2d63); border-radius: 10px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.06); }
  .tile img { max-width: 100%; max-height: 100%; image-rendering: pixelated; pointer-events: none; }
  .tile.on { outline: 3px solid #ffe27a; outline-offset: 1px; }
  .tile.dim { opacity: .35; }
  .tile.empty { border-style: dashed; }
  .tile.picked { outline: 3px solid #ff7a8a; outline-offset: 1px; }
  .tile.picked::after { content: '✓'; position: absolute; right: 2px; top: 0; font-size: 14px; color: #ff9aa8; text-shadow: 0 0 3px #000; }
  .inv-bar { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 6px; }
  .ui-btn.small { padding: 4px 10px; font-size: 12px; min-height: 0; }
  .ui-btn.danger { background: #b8445a; border-color: #ff8aa0; color: #fff; }
  .ruu-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .ruu-row .tile { width: 52px; height: 52px; flex: none; }
  .ruu-info { font-size: 12px; color: #d8ccff; line-height: 1.4; }
  .tile .slot-label { font-size: 12px; color: #7d72a0; }
  .tile .cap { position: absolute; left: 3px; top: 1px; font-size: 9px; color: #b9aee0; }
  .tile.empty .cap { display: none; }
  .tile .badge { position: absolute; right: 3px; bottom: 1px; font-size: 12px; color: #fff; text-shadow: 0 0 3px #000, 0 0 3px #000; }
  .tile .eq { position: absolute; left: 3px; top: 2px; padding: 0 3px; font-size: 10px; color: #160f2a; background: #ffe27a; border-radius: 3px; }
  .tile .new { position: absolute; right: 4px; top: 4px; width: 9px; height: 9px; border-radius: 50%; background: #ff9ec0; }
  .detail { position: sticky; bottom: -14px; z-index: 2; margin: 0 -2px -4px; padding: 8px 12px; background: #1e1734; border: 1px solid #5a4d86; border-left: 5px solid var(--rc, #5a4d86); border-radius: 8px;
    box-shadow: 0 -10px 18px rgba(6, 3, 12, .75); display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; }
  .detail .d-sub, .detail .d-cmp { flex: 1 1 260px; min-width: 0; }
  .detail .d-acts { margin-left: auto; }
  .d-name { font-size: 17px; color: var(--rc, #f0e8ff); }
  .d-rar { margin-left: 8px; font-size: 12px; color: #b9aee0; white-space: nowrap; }
  .d-sub, .d-cmp { font-size: 13px; color: #cfc3ea; line-height: 1.5; }
  .d-stats { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 14px; color: #ffe9a8; }
  .d-acts { display: flex; flex-wrap: wrap; gap: 6px; }
  .cats { display: flex; gap: 4px; }
  .cat { flex: 1; min-height: 40px; font: inherit; font-size: 14px; color: #cfc3ea; background: #1e1734; border: 1px solid #3b2d63; border-radius: 8px; }
  .cat.on { color: #160f2a; background: #b9a2ff; border-color: #b9a2ff; }
  .inv-grid { display: grid; grid-template-columns: repeat(auto-fill, 64px); gap: 8px; justify-content: start; align-content: start; padding: 8px;
    background: #120c22; border: 1px solid #3b2d63; border-radius: 10px; min-height: 160px; }
  .inv-count { font-size: 12px; color: #9d90c8; text-align: right; }
  @media (max-width: 620px) { .home { grid-template-columns: minmax(0, 1fr); } }
  /* ---- メニューの密度を上げる（スマホ横持ちで画面に収まる大きさ） ---- */
  .ui-panel { max-width: 720px; }
  .ui-body > * { flex-shrink: 0; }   /* 行が縮んで重ならないように（入りきらない分はスクロール） */
  .ui-head { padding: 4px 6px 4px 14px; gap: 8px; }
  .ui-title { font-size: 16px; }
  .ui-head-right { font-size: 13px; }
  .ui-close { min-width: 36px; min-height: 36px; font-size: 15px; }
  .ui-tabs { padding: 4px 6px 0; }
  .ui-tab { min-height: 32px; font-size: 13px; }
  .ui-body { padding: 8px 10px 10px; gap: 6px; }
  .ui-h { font-size: 12px; margin-top: 6px; letter-spacing: .05em; }
  .ui-row { min-height: 0; padding: 6px 10px; gap: 10px; border-left-width: 4px; }
  .ui-row .name { font-size: 14px; line-height: 1.35; }
  .ui-row .sub { font-size: 11px; line-height: 1.45; margin-top: 3px; color: #a99fd0; }
  .ui-row .price { flex-shrink: 0; min-width: 64px; text-align: right; font-size: 14px; color: #ffe27a; font-variant-numeric: tabular-nums; }
  .ui-btn { min-width: 56px; min-height: 34px; padding: 0 10px; font-size: 13px; }
  .ui-note { font-size: 12px; }
  /* 自宅 */
  .ui-panel.wide { max-width: 860px; height: auto; max-height: 100%; }
  .home { grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 10px; padding-bottom: 0; }
  .doll { grid-template-columns: 50px minmax(0, 1fr) 50px; grid-template-rows: repeat(3, 50px); gap: 6px 8px; }
  .tile { width: 50px; height: 50px; padding: 3px; border-width: 2px; border-radius: 8px; }
  .tile .cap { font-size: 8px; }
  .tile .slot-label { font-size: 10px; }
  .tile .badge { font-size: 10px; }
  .tile .eq { font-size: 9px; }
  .tile .new { width: 7px; height: 7px; }
  .doll .hero img { height: 118%; }
  .detail { position: static; margin: 0; padding: 6px 10px; box-shadow: none; gap: 2px 10px; min-height: 76px; align-content: flex-start; }
  .d-name { font-size: 14px; }
  .d-sub, .d-cmp { font-size: 11px; }
  .d-stats { font-size: 12px; gap: 4px 10px; }
  .d-acts { gap: 4px; }
  .detail .d-acts { margin-left: 0; }
  .cats { gap: 3px; }
  .cat { min-height: 30px; font-size: 12px; }
  .inv-grid { grid-template-columns: repeat(auto-fill, 50px); gap: 6px; padding: 6px; min-height: 0; }
  .inv-count { font-size: 11px; }
  /* 自宅：主人公まわりを詰めて、詳細と装備ボタンまで1画面に収める */
  .doll { grid-template-columns: 44px minmax(0, 1fr) 44px; grid-template-rows: repeat(3, 44px); gap: 5px 8px; }
  .doll .tile { width: 44px; height: 44px; }
  .detail { min-height: 64px; }
  .detail .d-sub { flex: 1 1 100%; }
  .detail .d-cmp { flex: 0 1 auto; }
  .detail { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 8px; row-gap: 2px; align-items: start; }
  .detail > :not(.d-acts) { grid-column: 1 / -1; }
  .detail > .d-name { grid-column: 1; align-self: center; }
  .detail .d-acts { grid-column: 2; grid-row: 1; flex-direction: row; flex-wrap: nowrap; margin: 0; }
  .doll { grid-template-columns: 40px minmax(0, 1fr) 40px; grid-template-rows: repeat(3, 40px); gap: 4px 8px; }
  .doll .tile { width: 40px; height: 40px; }
  .detail .ui-btn { min-width: 0; padding: 0 8px; }
  .detail .ui-btn { min-height: 28px; font-size: 12px; padding: 0 10px; }
  /* アイコンは枠の中に収める（縦長・横長の絵がはみ出さないように） */
  .tile { overflow: hidden; }
  .tile img { width: 100%; height: 100%; max-width: none; max-height: none; object-fit: contain; }
</style>
<div id="wrap"><canvas id="game" width="1920" height="1080"></canvas></div>
<div id="touch" aria-hidden="true">
  <div class="btn" data-btn="left">◀</div>
  <div class="btn" data-btn="right">▶</div>
  <div class="btn sm" data-btn="run">ダッシュ</div>
  <div class="btn lg" data-btn="attack">攻撃</div>
  <div class="btn" data-btn="jump">ジャンプ</div>
  <div class="btn sm" data-btn="guard">ガード</div>
  <div class="btn" data-btn="kick">キック</div>
  <div class="btn" data-btn="special">必殺</div>
  <div class="btn sm" data-btn="swap">武器</div>
  <div class="btn sm" data-btn="pause">II</div>
  <div class="btn" data-btn="down" hidden>しらべる</div>
  <div class="btn sm" data-btn="item">道具</div>
</div>
<div id="rotate"><div class="ph"></div><div>スマホを横向きにしてね</div><div style="font-size:13px;opacity:.7">This game is played in landscape.</div></div>

<script src="src/systems/save.js"></script>
<script src="src/systems/inventory.js"></script>
<script src="src/systems/stats.js"></script>

<script src="src/data/dungeons.js"></script>
<script src="src/data/loot.js"></script>
<script src="src/dungeon/generator.js"></script>
<script src="src/dungeon/gimmicks.js"></script>
<script src="src/town/town.js"></script>
<script src="src/game.js"></script>
